<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f7">
  <title>Rücken-Check: Ist deine Tiefenmuskulatur blockiert? | Stabil im Alltag</title>
  <meta name="description" content="Finde in 60 Sekunden heraus, warum deine Rückenbeschwerden immer wiederkehren. 11 kurze Fragen, kein Konto, keine E-Mail.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../../../assets/logo_transparent.png">
  <link rel="apple-touch-icon" href="../../../assets/logo_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}

    :root{
      --primary:      oklch(45% 0.088 242);
      --primary-deep: oklch(36% 0.078 242);
      --primary-pale: oklch(95% 0.022 242);
      --teal:         oklch(52% 0.092 165);
      --teal-deep:    oklch(43% 0.082 165);
      --teal-pale:    oklch(95% 0.03 165);
      --ink:          oklch(27% 0.021 242);
      --ink-soft:     oklch(43% 0.022 242);
      --muted:        oklch(56% 0.017 242);
      --surface:      oklch(99.5% 0.004 240);
      --canvas:       oklch(97% 0.009 235);
      --line:         oklch(89% 0.014 235);
      --line-soft:    oklch(93% 0.01 235);
      --danger:       oklch(53% 0.16 28);
      --danger-pale:  oklch(95% 0.03 28);
      --amber:        oklch(58% 0.11 68);
      --amber-pale:   oklch(96% 0.04 78);
      --gold:         oklch(74% 0.135 78);
      --shadow-sm:    0 2px 10px oklch(40% 0.05 242 / .07);
      --shadow-md:    0 14px 40px oklch(35% 0.05 242 / .12);
      --shadow-lg:    0 24px 64px oklch(30% 0.05 242 / .16);
      --ease:         cubic-bezier(.16,1,.3,1);
      --r:            14px;
      --r-lg:         20px;
    }

    html{font-size:17px;background:var(--canvas);-webkit-text-size-adjust:100%}

    body{
      margin:0;
      min-height:100dvh;
      color:var(--ink);
      font-family:"Libre Franklin",system-ui,sans-serif;
      line-height:1.55;
      background:
        radial-gradient(120% 60% at 82% -8%, oklch(93% 0.04 165 / .55), transparent 60%),
        radial-gradient(130% 55% at 8% 108%, oklch(93% 0.04 242 / .5), transparent 62%),
        var(--canvas);
      -webkit-font-smoothing:antialiased;
    }

    h1,h2,h3,p{margin:0}
    h1,h2,h3{font-family:"Lora",Georgia,serif;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
    img{display:block;max-width:100%}
    button,a{font:inherit;-webkit-tap-highlight-color:transparent}
    button{color:inherit}
    [tabindex="-1"]:focus{outline:none}
    b,strong{font-weight:700}

    .app{
      min-height:100dvh;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }

    /* ── TOPBAR ── */
    .topbar{
      position:sticky;top:0;z-index:20;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:12px;
      padding:10px clamp(14px,4vw,26px);
      padding-top:max(10px,env(safe-area-inset-top));
      background:color-mix(in oklch,var(--canvas) 88%,transparent);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line-soft);
    }
    .brand{display:inline-flex;align-items:center;height:44px}
    .brand img{height:40px;width:auto}
    .back-btn{
      grid-column:3;
      min-height:44px;min-width:44px;
      display:inline-flex;align-items:center;gap:5px;
      padding:0 6px;border:0;background:transparent;cursor:pointer;
      color:var(--primary);font-weight:700;font-size:.82rem;
    }
    .back-btn svg{width:18px;height:18px}
    .back-btn[hidden]{visibility:hidden}
    .progress{grid-column:2;display:grid;gap:6px;max-width:520px;width:100%;margin:0 auto}
    .progress-meta{display:flex;justify-content:space-between;font-size:.66rem;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
    .progress-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
    .progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--teal-deep));transition:width .5s var(--ease)}

    /* ── STAGE ── */
    main{display:grid;align-items:start;justify-items:center;padding:clamp(16px,4vw,32px) clamp(14px,4vw,26px) 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
    .stage{width:100%;max-width:560px}
    .screen{animation:rise .42s var(--ease) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    .kicker{
      display:inline-flex;align-items:center;gap:8px;
      margin-bottom:12px;
      color:var(--teal-deep);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    }
    .kicker::before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}

    .q-title{font-size:clamp(1.55rem,6.4vw,2.1rem);line-height:1.16;color:var(--primary-deep)}
    .q-sub{margin-top:10px;color:var(--ink-soft);font-size:clamp(.95rem,3.4vw,1.02rem);line-height:1.55;max-width:44ch}

    /* hero headline (screen 1) */
    .hero-eyebrow{margin-bottom:14px;color:var(--danger);font-weight:800;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
    .hero-title{font-size:clamp(1.7rem,7.4vw,2.4rem);line-height:1.12;color:var(--primary-deep)}
    .hero-title em{font-style:italic;color:var(--teal-deep)}
    .hero-sub{margin-top:12px;font-size:1.02rem;color:var(--ink-soft)}

    /* ── OPTIONS ── */
    .options{display:grid;gap:10px;margin-top:22px}
    .opt{
      display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
      width:100%;min-height:58px;padding:14px 16px;
      border:1.5px solid var(--line);border-radius:var(--r);
      background:var(--surface);
      text-align:left;cursor:pointer;
      transition:border-color .18s ease,background .18s ease,transform .18s var(--ease),box-shadow .18s ease;
    }
    .opt:active{transform:scale(.985)}
    @media(hover:hover){.opt:hover{border-color:color-mix(in oklch,var(--teal) 55%,var(--line));box-shadow:var(--shadow-sm)}}
    .opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-pale);box-shadow:0 0 0 1.5px var(--teal) inset}
    .opt-body{min-width:0;display:grid;gap:2px}
    .opt-label{font-weight:700;color:var(--ink);line-height:1.3}
    .opt-detail{font-size:.8rem;color:var(--muted);line-height:1.4}
    .opt-mark{
      width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:50%;position:relative;
      transition:border-color .18s ease,background .18s ease;
    }
    .opt[data-multi="true"] .opt-mark{border-radius:7px}
    .opt[aria-pressed="true"] .opt-mark{border-color:var(--teal);background:var(--teal)}
    .opt[aria-pressed="true"] .opt-mark::after{
      content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;
      border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
    }

    /* ── BUTTONS ── */
    .cta{
      display:inline-flex;align-items:center;justify-content:center;gap:9px;
      width:100%;min-height:56px;padding:15px 22px;
      border:0;border-radius:var(--r);
      background:var(--teal);color:var(--surface);
      font-weight:800;font-size:1rem;letter-spacing:.01em;text-decoration:none;cursor:pointer;
      box-shadow:0 10px 26px oklch(43% 0.082 165 / .28);
      transition:background .18s ease,transform .18s var(--ease),box-shadow .18s ease;
    }
    .cta:active{transform:scale(.99)}
    @media(hover:hover){.cta:hover{background:var(--teal-deep);transform:translateY(-1px)}}
    .cta:disabled{opacity:.42;box-shadow:none;cursor:not-allowed}
    .cta svg{width:18px;height:18px;flex:none}
    .cta-lg{min-height:60px;font-size:1.05rem}
    .cta-ghost{background:var(--surface);color:var(--primary-deep);border:1.5px solid var(--line);box-shadow:none}
    @media(hover:hover){.cta-ghost:hover{background:var(--primary-pale)}}

    .action{margin-top:22px;display:grid;gap:10px}
    .hint{text-align:center;color:var(--muted);font-size:.78rem;font-weight:600}

    .privacy{
      margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;
      color:var(--muted);font-size:.76rem;font-weight:600;
    }
    .privacy svg{width:16px;height:16px;color:var(--teal-deep);flex:none}

    /* ── VISUAL: body map ── */
    .bodymap{
      margin-top:18px;position:relative;
      display:grid;place-items:center;
      padding:18px;border-radius:var(--r-lg);
      background:radial-gradient(circle at 50% 38%,oklch(93% 0.04 165 / .7),transparent 60%),var(--surface);
      border:1px solid var(--line);
    }
    .bodymap svg{width:min(60%,190px);height:auto;color:color-mix(in oklch,var(--primary) 42%,var(--line))}
    .bodymap .zone{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .25s ease}
    .bodymap[data-zone="mid"] .z-mid,
    .bodymap[data-zone="side"] .z-side,
    .bodymap[data-zone="band"] .z-band,
    .bodymap[data-zone="radiate"] .z-mid,
    .bodymap[data-zone="radiate"] .z-glute{opacity:1;animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}

    /* ── INTERSTITIAL shared ── */
    .lead{margin-top:12px;color:var(--ink-soft);font-size:1.02rem;line-height:1.6;max-width:46ch}
    .callout{
      margin-top:18px;padding:16px 18px;border-radius:var(--r);
      background:var(--amber-pale);border:1px solid color-mix(in oklch,var(--amber) 40%,var(--line));
    }
    .callout.good{background:var(--teal-pale);border-color:color-mix(in oklch,var(--teal) 40%,var(--line))}
    .callout-title{display:flex;align-items:center;gap:8px;font-family:"Lora",serif;font-weight:600;font-size:1.02rem;color:var(--ink);margin-bottom:6px}
    .callout p{font-size:.92rem;color:var(--ink-soft);line-height:1.55}
    .callout svg{width:19px;height:19px;flex:none}

    /* ── FAKTEN chart ── */
    .chart-card{margin-top:20px;padding:18px 16px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
    .chart-cap{font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
    .chart{width:100%;height:auto;display:block;overflow:visible}
    .chart .grid-line{stroke:var(--line-soft);stroke-width:1}
    .chart .axis-line{stroke:var(--line);stroke-width:1.5}
    .chart .tick,.chart .ylab{font-size:9px;font-weight:700;fill:var(--muted);font-family:"Libre Franklin",sans-serif}
    .chart .risk{fill:var(--danger);opacity:0}
    .chart .area{opacity:0}
    .chart .curve{fill:none;stroke:var(--danger);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
    .chart .marker-line{stroke:var(--primary-deep);stroke-width:1.5;stroke-dasharray:3 3;opacity:0}
    .chart .dot-halo{fill:var(--primary);opacity:0}
    .chart .dot{fill:var(--primary-deep);stroke:var(--surface);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
    .chart .du-pill{opacity:0}
    .chart .du-pill rect{fill:var(--primary-deep)}
    .chart .du-pill text{fill:var(--surface);font-size:9px;font-weight:800;font-family:"Libre Franklin",sans-serif}
    /* staged reveal, pure CSS, GPU-friendly */
    .chart .curve{animation:cDraw .9s var(--ease) .1s forwards}
    .chart .area{animation:cFade .7s ease .5s forwards}
    .chart .risk{animation:cRisk .6s ease .3s forwards}
    .chart .marker-line{animation:cFade .4s ease .95s forwards}
    .chart .dot-halo{animation:cHalo 1.6s ease-out 1.05s infinite}
    .chart .dot{animation:cPop .5s var(--ease) 1s forwards}
    .chart .du-pill{animation:cFade .4s ease 1.15s forwards}
    @keyframes cDraw{to{stroke-dashoffset:0}}
    @keyframes cFade{to{opacity:1}}
    @keyframes cRisk{to{opacity:.09}}
    @keyframes cPop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
    @keyframes cHalo{0%{opacity:.5;transform:scale(.6);transform-box:fill-box;transform-origin:center}70%,100%{opacity:0;transform:scale(2.4);transform-box:fill-box;transform-origin:center}}
    .chart-note{margin-top:12px;font-size:.68rem;color:var(--muted);line-height:1.4}
    .fakten-insight{margin-top:12px;display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border-radius:var(--r);background:var(--primary-pale);opacity:0;transform:translateY(6px);animation:cRise .5s var(--ease) 1.2s forwards}
    .fakten-insight svg{width:18px;height:18px;flex:none;color:var(--primary-deep);margin-top:1px}
    .fakten-insight p{font-size:.9rem;line-height:1.45;color:var(--ink)}
    .fakten-insight b{color:var(--primary-deep)}
    @keyframes cRise{to{opacity:1;transform:none}}

    .steps{margin-top:20px;display:grid;gap:12px}
    .step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
    .step-badge{
      width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--primary-pale);color:var(--primary-deep);font-family:"Lora",serif;font-weight:700;font-size:.95rem;
    }
    .step h3{font-size:.98rem;color:var(--ink);line-height:1.3;margin-bottom:2px}
    .step p{font-size:.86rem;color:var(--ink-soft);line-height:1.5}

    /* ── SOCIAL proof ── */
    .counter{
      margin-top:8px;text-align:center;padding:24px 18px;border-radius:var(--r-lg);
      background:linear-gradient(180deg,var(--primary-deep),var(--primary));color:var(--surface);box-shadow:var(--shadow-md);
    }
    .counter-num{font-family:"Lora",serif;font-weight:700;font-size:clamp(2.4rem,12vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums}
    .counter-label{margin-top:8px;font-size:.92rem;color:oklch(94% 0.02 235);max-width:30ch;margin-inline:auto}
    .rating{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-soft);font-weight:600}
    .stars{color:var(--gold);letter-spacing:1px;font-size:1rem}
    .bars{margin-top:18px;display:grid;gap:12px}
    .bar-row{display:grid;gap:5px}
    .bar-head{display:flex;justify-content:space-between;font-size:.84rem;font-weight:700;color:var(--ink)}
    .bar-head b{color:var(--teal-deep);font-variant-numeric:tabular-nums}
    .bar-track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
    .bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--teal-deep));transition:width 1.1s var(--ease)}

    /* ── SCIENCE ── */
    .sci-photo{margin-top:18px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);aspect-ratio:16/10}
    .sci-photo img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
    .sci-cap{margin-top:8px;font-size:.72rem;color:var(--muted);text-align:center}
    .duo{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .duo-cell{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:center}
    .duo-cell .big{font-family:"Lora",serif;font-weight:700;font-size:1.3rem;color:var(--teal-deep)}
    .duo-cell h3{font-size:.92rem;margin:4px 0 2px;color:var(--ink)}
    .duo-cell p{font-size:.78rem;color:var(--muted);line-height:1.4}

    /* ── warum wir fragen note ── */
    .why{
      margin-top:18px;padding:13px 15px;border-radius:var(--r);
      background:var(--primary-pale);
      font-size:.84rem;color:var(--ink-soft);line-height:1.5;
    }
    .why b{color:var(--primary-deep)}

    /* ── BEFUND meters ── */
    .befund-grid{margin-top:20px;display:grid;gap:12px}
    .meter{padding:15px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
    .meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
    .meter-name{font-size:.82rem;font-weight:700;color:var(--ink-soft)}
    .meter-val{font-size:.82rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-family:"Libre Franklin",sans-serif}
    .meter-val.hi{color:var(--danger)}
    .meter-val.mid{color:var(--amber)}
    .meter-val.good{color:var(--teal-deep)}
    .meter-scale{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
    .meter-scale span{display:block;height:100%;width:0;border-radius:99px;transition:width 1s var(--ease)}
    .meter-scale span.hi{background:linear-gradient(90deg,var(--amber),var(--danger))}
    .meter-scale span.good{background:linear-gradient(90deg,var(--teal),var(--teal-deep))}
    .befund-note{margin-top:16px;padding:16px 18px;border-radius:var(--r);background:var(--teal-pale);border:1px solid color-mix(in oklch,var(--teal) 35%,var(--line))}
    .befund-note h3{font-size:.98rem;color:var(--ink);margin-bottom:6px}
    .befund-note p{font-size:.9rem;color:var(--ink-soft);line-height:1.55}

    /* ── PLAN timeline ── */
    .timeline{margin-top:20px;display:grid;gap:0}
    .tl-item{display:grid;grid-template-columns:auto 1fr;gap:14px;padding-bottom:20px;position:relative}
    .tl-item:last-child{padding-bottom:0}
    .tl-rail{display:grid;justify-items:center;gap:0}
    .tl-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--surface);font-family:"Lora",serif;font-weight:700;font-size:.9rem;z-index:1}
    .tl-line{width:2px;flex:1;background:var(--line);margin-top:2px;min-height:24px}
    .tl-item:last-child .tl-line{display:none}
    .tl-body{padding-bottom:4px}
    .tl-week{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-deep);margin-bottom:3px}
    .tl-body h3{font-size:.98rem;color:var(--ink);margin-bottom:4px}
    .tl-body p{font-size:.86rem;color:var(--ink-soft);line-height:1.5}
    .progress-viz{margin-top:20px;padding:18px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
    .pv-head{display:flex;justify-content:space-between;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em}
    .pv-bars{display:flex;align-items:flex-end;gap:8px;height:96px}
    .pv-bar{flex:1;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--teal),var(--teal-deep));height:0;transition:height .9s var(--ease)}
    .pv-bar:first-child{background:linear-gradient(180deg,var(--line),color-mix(in oklch,var(--muted) 30%,var(--line)))}
    .pv-labels{display:flex;gap:8px;margin-top:8px}
    .pv-labels span{flex:1;text-align:center;font-size:.64rem;font-weight:700;color:var(--muted)}

    /* ── MICRO yes ── */
    .micro{text-align:center;padding-top:16px}
    .micro .kicker{justify-content:center}
    .micro-title{font-size:clamp(1.5rem,6.2vw,2rem);line-height:1.18;color:var(--primary-deep)}
    .micro-sub{margin-top:12px;color:var(--ink-soft);font-size:1rem;max-width:36ch;margin-inline:auto}
    .yesno{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .yesno .opt{grid-template-columns:1fr;justify-items:center;text-align:center;min-height:64px}
    .yesno .opt-label{font-size:1.05rem}

    /* ── IMAGE OPTIONS (Frage 2) ── */
    .img-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
    .img-opt{display:block;padding:0;min-height:0;overflow:hidden;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease,transform .18s var(--ease)}
    .img-opt:active{transform:scale(.985)}
    @media(hover:hover){.img-opt:hover{border-color:color-mix(in oklch,var(--teal) 55%,var(--line));box-shadow:var(--shadow-sm)}}
    .img-opt[aria-pressed="true"]{border-color:var(--teal);background:var(--surface);box-shadow:0 0 0 1.5px var(--teal) inset}
    .img-opt .thumb{display:block;aspect-ratio:1/1;background:var(--primary-pale)}
    .img-opt .thumb img{width:100%;height:100%;object-fit:cover;display:block}

    var FAKTEN_DATA = [[25,.96],[35,.89],[42,.8],[48,.62],[54,.44],[60,.3],[67,.22]];
    function smoothPath(pts){
      if(pts.length<2) return "";
      var d="M"+pts[0].x+","+pts[0].y;
      for(var i=0;i<pts.length-1;i++){
        var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
        var c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
        var c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
        d+="C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2.x.toFixed(1)+","+p2.y.toFixed(1);
      }
      return d;
    }
    function interp(data,a){
      for(var i=0;i<data.length-1;i++){
        if(a<=data[i+1][0]){ var t=(a-data[i][0])/(data[i+1][0]-data[i][0]); return data[i][1]+t*(data[i+1][1]-data[i][1]); }
      }
      return data[data.length-1][1];
    }
    function buildFaktenChart(ageKey){
      var W=320,H=172, x0=18,x1=304, yTop=20,yBot=134, aMin=25,aMax=67;
      var ax=function(a){return x0+(a-aMin)/(aMax-aMin)*(x1-x0);};
      var ay=function(v){return yBot-v*(yBot-yTop);};
      var pts=FAKTEN_DATA.map(function(d){return {x:ax(d[0]),y:ay(d[1])};});
      var curve=smoothPath(pts);
      var area=curve+" L"+x1.toFixed(1)+","+yBot+" L"+x0.toFixed(1)+","+yBot+" Z";
      var mAge=({u45:41,"45":50,"55":60,"65":66})[ageKey]||50;
      var mx=ax(mAge), my=ay(interp(FAKTEN_DATA,mAge)), riskX=ax(45);
      var pillW=30, pillX=Math.max(x0,Math.min(mx-pillW/2,x1-pillW));
      var ticks=[[25,"25"],[40,"40"],[55,"55"],[67,"65+"]];
      var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
      s+='<defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--danger)" stop-opacity=".2"/><stop offset="1" stop-color="var(--danger)" stop-opacity="0"/></linearGradient></defs>';
      [0.33,0.66].forEach(function(f){ var gy=(yTop+f*(yBot-yTop)).toFixed(1); s+='<line class="grid-line" x1="'+x0+'" y1="'+gy+'" x2="'+x1+'" y2="'+gy+'"/>'; });
      s+='<rect class="risk" x="'+riskX.toFixed(1)+'" y="'+yTop+'" width="'+(x1-riskX).toFixed(1)+'" height="'+(yBot-yTop)+'"/>';
      s+='<path class="area" d="'+area+'" fill="url(#gArea)"/>';
      s+='<path class="curve" pathLength="1" d="'+curve+'"/>';
      s+='<line class="axis-line" x1="'+x0+'" y1="'+yBot+'" x2="'+x1+'" y2="'+yBot+'"/>';
      s+='<text class="ylab" x="'+x0+'" y="'+(yTop+3)+'">hoch</text>';
      s+='<text class="ylab" x="'+x0+'" y="'+(yBot-4)+'">niedrig</text>';
      ticks.forEach(function(t){ s+='<text class="tick" x="'+ax(t[0]).toFixed(1)+'" y="'+(yBot+14)+'" text-anchor="middle">'+t[1]+'</text>'; });
      s+='<line class="marker-line" x1="'+mx.toFixed(1)+'" y1="'+yTop+'" x2="'+mx.toFixed(1)+'" y2="'+my.toFixed(1)+'"/>';
      s+='<circle class="dot-halo" cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="6"/>';
      s+='<circle class="dot" cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="6"/>';
      s+='<g class="du-pill"><rect x="'+pillX.toFixed(1)+'" y="'+(yTop-14)+'" width="'+pillW+'" height="14" rx="7"/><text x="'+(pillX+pillW/2).toFixed(1)+'" y="'+(yTop-4)+'" text-anchor="middle">Du</text></g>';
      return s+'</svg>';
    }

          '<span>'+icon.check+' Lieferung in 2 bis 3 Tagen</span>'+
        '</div>'+
        '<p class="disclaimer">Der Wellenpuls LWS ist ein Trainingsgerät, kein Medizinprodukt, und ersetzt keine ärztliche Beratung. Dieser Rücken-Check dient der Einordnung und stellt keine Diagnose. Individuelle Ergebnisse können variieren.</p>'+
        '</section>';
    }

    /* ─────────── ENGINE ─────────── */
    function screenHTML(s){
      switch(s.type){
        case "hero": return renderHero(s);
        case "q": return renderQ(s);
        case "qm": return renderQM(s);
        case "fakten": return renderFakten();
        case "social": return renderSocial();
        case "science": return renderScience();
        case "befund": return renderBefund();
        case "plan": return renderPlan();
        case "micro": return renderMicro(s);
        case "loading": return renderLoading();
        case "result": return renderResult();
      }
      return "";
    }

    function updateProgress(){
      var s = SCREENS[cur];
      var pct = Math.round((cur/(SCREENS.length-1))*100);
      pFill.style.width = pct+"%";
      if(s.type==="q"||s.type==="qm"||s.type==="hero"){
        var n = s.n || 1;
        pLabel.textContent = "Frage "+n+" / "+totalQ;
      } else if(s.type==="result"){ pLabel.textContent="Fertig"; }
      else { pLabel.textContent="Rücken-Check"; }
      pCount.textContent = pct+" %";
    }

    function render(){
      stage.innerHTML = screenHTML(SCREENS[cur]);
      backBtn.hidden = cur===0;
      updateProgress();
      wire();
      sendeSchritt(cur, SCREENS[cur].id || SCREENS[cur].type, "view");
      onEnter(SCREENS[cur]);
      try{ window.scrollTo({top:0,behavior: reduce ? "auto":"smooth"}); }catch(e){ window.scrollTo(0,0); }
      var h1 = stage.querySelector("h1"); if(h1){ h1.setAttribute("tabindex","-1"); }
    }

    function go(n){
      if(n<0||n>=SCREENS.length) return;
      cur=n; render();
      try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
    }
    function next(){ go(cur+1); }
    function back(){ go(cur-1); }

    function wire(){
      // single-select options
      stage.querySelectorAll('.opt[data-multi="false"]').forEach(function(btn){
        btn.addEventListener("click", function(){
          var s = SCREENS[cur];
          answers[s.id] = btn.dataset.val;
          stage.querySelectorAll('.opt').forEach(function(b){b.setAttribute("aria-pressed", b===btn?"true":"false");});
          if(s.visual==="bodymap"){ var bm=stage.querySelector(".bodymap"); if(bm) bm.setAttribute("data-zone", btn.dataset.val); }
          if(s.auto){ setTimeout(next, s.visual==="bodymap"?520:260); }
        });
      });
      // multi-select
      stage.querySelectorAll('.opt[data-multi="true"]').forEach(function(btn){
        btn.addEventListener("click", function(){
          var s = SCREENS[cur];
          var arr = Array.isArray(answers[s.id])?answers[s.id].slice():[];
          var val = btn.dataset.val, excl = btn.dataset.excl==="true";
          if(excl){ arr = arr.indexOf(val)>-1?[]:[val]; }
          else{ var i=arr.indexOf(val); if(i>-1)arr.splice(i,1); else arr.push(val); arr=arr.filter(function(v){ var o=s.options.filter(function(x){return x[1]===v})[0]; return !(o&&o[3]); }); }
          answers[s.id]=arr;
          stage.querySelectorAll('.opt').forEach(function(b){ b.setAttribute("aria-pressed", arr.indexOf(b.dataset.val)>-1?"true":"false"); });
          var cont = stage.querySelector(".continue"); if(cont) cont.disabled = arr.length===0;
        });
      });
      // micro yes/no
      stage.querySelectorAll('.opt[data-micro]').forEach(function(btn){
        btn.addEventListener("click", function(){ setTimeout(next,180); });
      });
      // continue buttons
      var cont = stage.querySelector(".continue");
      if(cont) cont.addEventListener("click", next);
      // back
      backBtn.onclick = back;
    }

    function animateCount(el, target, dur){
      if(reduce){ el.textContent = target.toLocaleString("de-DE"); return; }
      var start=performance.now();
      function tick(t){
        var p=Math.min((t-start)/dur,1);
        var e=1-Math.pow(1-p,3);
        el.textContent = Math.round(target*e).toLocaleString("de-DE");
        if(p<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function onEnter(s){
      if(s.type==="social"){
        stage.querySelectorAll(".counter-num").forEach(function(num){ animateCount(num, parseInt(num.dataset.count,10), 1600); });
        setTimeout(function(){
          stage.querySelectorAll(".bar-fill").forEach(function(f){ f.style.width=f.dataset.w+"%"; });
          stage.querySelectorAll(".bar-head b").forEach(function(b){ animateCount2(b, parseInt(b.dataset.pct,10)); });
        },200);
      }
      if(s.type==="befund"){
        setTimeout(function(){ stage.querySelectorAll(".meter-scale span").forEach(function(sp){ sp.style.width=sp.dataset.w+"%"; }); },200);
      }
      if(s.type==="plan"){
        setTimeout(function(){ stage.querySelectorAll(".pv-bar").forEach(function(b){ b.style.height=b.dataset.h+"%"; }); },200);
      }
      if(s.type==="loading"){ runLoading(); }
      if(s.type==="result"){ if(window.SIA_bindEvents) window.SIA_bindEvents(); sendQuizData(); }
    }
    function animateCount2(el, pct){
      if(reduce){ el.textContent=pct+" %"; return; }
      var start=performance.now();
      function tick(t){ var p=Math.min((t-start)/1100,1); var e=1-Math.pow(1-p,3); el.textContent=Math.round(pct*e)+" %"; if(p<1)requestAnimationFrame(tick);} requestAnimationFrame(tick);
    }

    function runLoading(){
      var pctEl=stage.querySelector(".ring-pct");
      var fill=stage.querySelector(".ring .fill");
      var stepEl=stage.querySelector("#loadStep");
      var circ=352, pct=0, stepIdx=0;
      var total = reduce?400:8000;
      var start=performance.now();
      function frame(t){
        var p=Math.min((t-start)/total,1);
        pct=Math.round(p*100);
        if(pctEl)pctEl.textContent=pct+" %";
        if(fill)fill.style.strokeDashoffset=circ*(1-p);
        var si=Math.min(LOAD_STEPS.length-1, Math.floor(p*LOAD_STEPS.length));
        if(si!==stepIdx && stepEl){ stepIdx=si; stepEl.style.opacity=0; setTimeout(function(){ stepEl.textContent=LOAD_STEPS[si]; stepEl.style.opacity=1; },160); }
        if(p<1) requestAnimationFrame(frame);
        else setTimeout(next, 350);
      }
      requestAnimationFrame(frame);
    }

    // Letzter erreichter Bildschirm beim Verlassen. Erst damit laesst sich der
    // Abbruch einem Schritt zuordnen — ohne dieses Ereignis fehlt bei jedem
    // Abbrecher genau die Information, warum er weg ist.
    // `pagehide` statt `unload`: `unload` feuert auf iOS/Safari oft nicht.
    var abbruchGesendet = false;
    window.addEventListener("pagehide", function(){
      if(abbruchGesendet) return;
      abbruchGesendet = true;
      var s = SCREENS[cur];
      sendeSchritt(cur, (s && (s.id || s.type)) || "", quizSent ? "ende" : "abbruch");
    });

    // start (support hash resume for back/forward within session)
    go(0);
  })();
  </script>
  <script src="../../../assets/consent.js" defer></script>
</body>
</html>
